<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 背景流光渐变：深邃鼠尾草墨绿 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B2F25"/>
      <stop offset="45%" stop-color="#2D483A"/>
      <stop offset="100%" stop-color="#466554"/>
    </linearGradient>

    <!-- 水上菱晶高光渐变：温润晨曦陶土金 -->
    <linearGradient id="prismSunlight" x1="200" y1="120" x2="330" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7C59F"/>
      <stop offset="40%" stop-color="#E88A68"/>
      <stop offset="100%" stop-color="#C25A38"/>
    </linearGradient>

    <!-- 水上菱晶次受光面 -->
    <linearGradient id="prismSunlightDark" x1="256" y1="150" x2="360" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DE7955"/>
      <stop offset="100%" stop-color="#9C3E1F"/>
    </linearGradient>

    <!-- 水下透光折射面 -->
    <linearGradient id="underwaterGrad" x1="256" y1="280" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#72A58F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#365C4C" stop-opacity="0.25"/>
    </linearGradient>

    <!-- 辉光滤镜 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 微波剪裁遮罩 -->
    <clipPath id="aboveWaterClip">
      <rect x="0" y="0" width="512" height="280"/>
    </clipPath>
    <clipPath id="underWaterClip">
      <rect x="0" y="280" width="512" height="232"/>
    </clipPath>
  </defs>

  <!-- 1. 圆角主体外壳 (iOS Squircle 式优雅圆角) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- 微弱高品质内发光内边框 -->
  <rect x="12" y="12" width="488" height="488" rx="116" stroke="#9BBCA9" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- 2. 水下氛围泛光 -->
  <circle cx="256" cy="340" r="130" fill="#5F8B75" opacity="0.2" filter="url(#softGlow)"/>

  <!-- 3. 水下部分（折射与潜藏的秘密菱面） -->
  <g clip-path="url(#underWaterClip)">
    <!-- 水下折射几何体：略微错位(模拟折射率) + 磨砂通透感 -->
    <g transform="translate(-4, 0)">
      <!-- 左下折射底面 -->
      <polygon points="256,280 180,380 256,430 256,280" fill="url(#underwaterGrad)"/>
      <!-- 右下折射底面 -->
      <polygon points="256,280 332,380 256,430 256,280" fill="#4D7967" fill-opacity="0.45"/>
      <!-- 水下网格线/探索线索虚线 -->
      <line x1="256" y1="280" x2="256" y2="430" stroke="#A6CEBA" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.6"/>
      <line x1="180" y1="380" x2="332" y2="380" stroke="#A6CEBA" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.4"/>
    </g>

    <!-- 水下扩散声呐/波纹（暗流涌动） -->
    <ellipse cx="256" cy="350" rx="160" ry="24" stroke="#7BA894" stroke-width="2" stroke-opacity="0.2"/>
    <ellipse cx="256" cy="390" rx="100" ry="16" stroke="#7BA894" stroke-width="1.5" stroke-opacity="0.15"/>
  </g>

  <!-- 4. 水上部分（破水而出的清晰真相几何） -->
  <g clip-path="url(#aboveWaterClip)">
    <!-- 左上半受光面 -->
    <polygon points="256,120 166,280 256,280" fill="url(#prismSunlight)"/>
    <!-- 右上半背光/阴影面 -->
    <polygon points="256,120 346,280 256,280" fill="url(#prismSunlightDark)"/>
    <!-- 中轴棱线反光 -->
    <line x1="256" y1="120" x2="256" y2="280" stroke="#FFF0E6" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- 5. 水平分界波纹（核心视觉焦点：真相冲破水面的涟漪） -->
  <g>
    <!-- 基础水平基准线 -->
    <path d="M 64 280 C 130 276, 190 284, 256 280 C 320 276, 380 284, 448 280" stroke="#98C2AD" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4"/>

    <!-- 核心外圈涟漪（椭圆透视） -->
    <ellipse cx="256" cy="280" rx="150" ry="22" stroke="#BCE3CF" stroke-width="3" fill="none" stroke-opacity="0.65"/>

    <!-- 核心中圈涟漪 -->
    <ellipse cx="256" cy="280" rx="105" ry="15" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-opacity="0.9" filter="url(#softGlow)"/>

    <!-- 贴近晶体的紧致内水圈 -->
    <ellipse cx="256" cy="280" rx="60" ry="9" stroke="#FFEAD9" stroke-width="2.5" fill="none" stroke-opacity="0.8"/>
  </g>

  <!-- 6. 顶端智慧/灵感星芒（代表猜出答案那一刻的闪光） -->
  <g transform="translate(256, 105)">
    <!-- 4角星芒 -->
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#FFE5D4" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>
